services:
  localstack:
    image: localstack/localstack:3.8
    container_name: promotions-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,dynamodbstreams,sqs
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 12
